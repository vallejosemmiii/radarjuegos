name: Bot Automatizado de Precios

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  rastrear-ofertas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        
      - name: Preparar servidor Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # <--- CAMBIADO A 22
          
      - name: Instalar conector de Base de Datos
        run: npm install @supabase/supabase-js
        
      - name: Encender el Bot
        run: node bot.js
