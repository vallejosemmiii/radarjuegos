name: Bot Automatizado de Precios

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 AM (UTC)
    - cron: '0 8 * * *'
  workflow_dispatch: # Crea un botón para que puedas encenderlo manualmente

jobs:
  rastrear-ofertas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v3
        
      - name: Preparar servidor Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Instalar conector de Base de Datos
        run: npm install @supabase/supabase-js
        
      - name: Encender el Bot
        run: node bot.js
