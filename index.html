<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Juegos - Ofertas y Lanzamientos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 20px; }
        
        header { text-align: center; padding: 40px 0; border-bottom: 1px solid #1f293d; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; color: #ffffff; cursor: pointer; user-select: none; }
        header h1 span { color: #a855f7; }
        header p { color: #94a3b8; margin-top: 10px; font-size: 1.1rem; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* VISTA CATÁLOGO */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .game-card { 
            background: #16192b; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #1f293d; 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; 
            cursor: pointer; 
        }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2); border-color: #a855f7; }
        .game-card img { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #1f293d; background: #111422; }
        .game-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .game-info h3 { font-size: 1.2rem; margin-bottom: 10px; color: #fff; }
        .platform { font-size: 0.85rem; color: #a855f7; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .price-box { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid #1f293d; margin-top: auto; }
        .price { font-size: 1.2rem; font-weight: bold; color: #4ade80; }
        
        .btn-ver { background: #a855f7; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; border: none; cursor: pointer; display: inline-block; text-align: center; }
        .btn-ver:hover { background: #9333ea; }
        
        /* VISTA DETALLE DINÁMICA */
        #detail-view { display: none; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-back { background: transparent; color: #a855f7; border: 1px solid #a855f7; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-bottom: 25px; transition: all 0.2s; }
        .btn-back:hover { background: #a855f7; color: #fff; }
        
        .detail-container { background: #16192b; border: 1px solid #1f293d; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .detail-header { display: flex; gap: 30px; padding: 35px; border-bottom: 1px solid #1f293d; flex-wrap: wrap; background: #111422; }
        .detail-header img { width: 100%; max-width: 420px; height: auto; border-radius: 8px; object-fit: cover; box-shadow: 0 5px 20px rgba(0,0,0,0.6); border: 1px solid #1f293d; background: #0b0e14; }
        .detail-text { flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: flex-start; }
        .detail-text h2 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; }
        .detail-text .platform { font-size: 1rem; margin-bottom: 20px; }
        
        /* CAJA DE SINOPSIS CON SCROLL INTERNO Y LECTURA CÓMODA */
        .summary-box { 
            background: #0b0e14; 
            border: 1px solid #1f293d; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            max-height: 220px; 
            overflow-y: auto; 
        }
        .summary-box::-webkit-scrollbar { width: 6px; }
        .summary-box::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 3px; }
        .summary-text { color: #cbd5e1; line-height: 1.6; font-size: 1.05rem; }
        
        .btn-trailer { background: #ef4444; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; width: fit-content; transition: background 0.2s; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-trailer:hover { background: #dc2626; }
        
        /* LISTA DE TIENDAS Y LOGOS */
        .detail-prices { padding: 35px; background: #0f121b; }
        .detail-prices h3 { font-size: 1.5rem; margin-bottom: 20px; border-left: 4px solid #4ade80; padding-left: 12px; color: #fff; }
        .store-list { display: flex; flex-direction: column; gap: 15px; }
        
        .store-item { 
            background: #16192b; 
            border: 1px solid #1f293d; 
            padding: 18px 25px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: border-color 0.2s, transform 0.2s; 
        }
        .store-item:hover { border-color: #4ade80; transform: translateX(4px); }
        
        .store-brand { display: flex; align-items: center; gap: 15px; }
        .store-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: #1f293d; padding: 4px; border: 1px solid #2d3748; }
        .store-name { font-size: 1.2rem; font-weight: bold; color: #fff; }
        
        .store-price { font-size: 1.4rem; color: #4ade80; font-weight: bold; }
        
        .loading { text-align: center; padding: 60px; color: #94a3b8; font-size: 1.2rem; width: 100%; grid-column: 1 / -1; }
        footer { text-align: center; padding: 40px 0; margin-top: 60px; border-top: 1px solid #1f293d; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 onclick="cerrarDetalle()">Radar<span>Juegos</span>.lat</h1>
            <p>El portal definitivo de ofertas y lanzamientos</p>
        </header>

        <main>
            <div id="main-view">
                <div id="games-grid" class="games-grid">
                    <div class="loading">Cargando catálogo desde Supabase...</div>
                </div>
            </div>

            <div id="detail-view">
                <button class="btn-back" onclick="cerrarDetalle()">← Volver al catálogo</button>
                <div class="detail-container">
                    <div class="detail-header">
                        <img id="detail-img" src="" alt="Portada del juego">
                        <div class="detail-text">
                            <h2 id="detail-title">Título del Juego</h2>
                            <p class="platform" id="detail-platform">Plataforma</p>
                            <div class="summary-box">
                                <p class="summary-text" id="detail-summary">Cargando sinopsis del juego...</p>
                            </div>
                            <a id="detail-trailer" href="#" target="_blank" class="btn-trailer">▶ Ver Tráiler Oficial</a>
                        </div>
                    </div>
                    <div class="detail-prices">
                        <h3>Opciones de Compra y Tiendas</h3>
                        <div id="store-list-container" class="store-list"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 radarjuegos.lat - Todos los derechos reservados.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://iqndiyuhcjxrugzfyjaj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbmRpeXVoY2p4cnVnemZ5amFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNjUyNzMsImV4cCI6MjEwOTY0MTI3M30.h-z1IcDbwAKvgVP1jwrjW8p-cxoTzuduIvLltjLDgqM';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let catalogoGlobal = [];

        // Logos oficiales con fallback de respaldo por seguridad
        function obtenerLogoTienda(nombreTienda) {
            const logos = {
                'Steam': 'https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg',
                'Instant Gaming': 'https://www.instant-gaming.com/themes/ig-light/images/ig-logo-round.svg',
                'Epic Games': 'https://upload.wikimedia.org/wikipedia/commons/3/31/Epic_Games_logo.svg',
                'Eneba': 'https://www.eneba.com/favicon.ico',
                'CDKeys': 'https://www.cdkeys.com/media/favicon/default/cdkeys-favicon.png'
            };
            return logos[nombreTienda] || 'https://cdn-icons-png.flaticon.com/512/1170/1170679.png';
        }

        async function cargarCatalogo() {
            const grid = document.getElementById('games-grid');
            try {
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*, game_prices(*)')
                    .order('id', { ascending: true });

                if (error || !games.length) {
                    grid.innerHTML = '<p class="loading">No se pudieron cargar los juegos.</p>';
                    return;
                }

                catalogoGlobal = games;

                grid.innerHTML = games.map(game => {
                    const precios = game.game_prices || [];
                    let mejorPrecio = 'Sin Stock';
                    if (precios.length > 0) {
                        precios.sort((a, b) => Number(a.price) - Number(b.price));
                        mejorPrecio = `Desde $${Number(precios[0].price).toFixed(2)}`;
                    }

                    return `
                        <div class="game-card" onclick="abrirDetalle(${game.id})">
                            <img src="${game.cover_image}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/300x160/1e1b4b/ffffff?text=Radar+Juegos'">
                            <div class="game-info">
                                <h3>${game.title}</h3>
                                <p class="platform">${game.platform}</p>
                                <div class="price-box">
                                    <div>
                                        <span style="font-size: 0.75rem; color: #94a3b8; display: block;">Mejor oferta</span>
                                        <span class="price">${mejorPrecio}</span>
                                    </div>
                                    <button class="btn-ver">Ver Info</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error:', err);
                grid.innerHTML = '<p class="loading">Ocurrió un error de conexión.</p>';
            }
        }

        function abrirDetalle(gameId) {
            const game = catalogoGlobal.find(g => g.id === gameId);
            if (!game) return;

            document.getElementById('detail-title').innerText = game.title;
            document.getElementById('detail-platform').innerText = game.platform;
            document.getElementById('detail-summary').innerText = game.summary || 'Sin descripción disponible.';
            document.getElementById('detail-img').src = game.cover_image;
            
            const btnTrailer = document.getElementById('detail-trailer');
            if (game.trailer_url) {
                btnTrailer.href = game.trailer_url;
                btnTrailer.style.display = 'inline-block';
            } else {
                btnTrailer.style.display = 'none';
            }

            const storeContainer = document.getElementById('store-list-container');
            const precios = game.game_prices || [];
            
            if (precios.length > 0) {
                precios.sort((a, b) => Number(a.price) - Number(b.price));
                
                storeContainer.innerHTML = precios.map(p => `
                    <div class="store-item">
                        <div class="store-brand">
                            <img src="${obtenerLogoTienda(p.store_name)}" class="store-logo" alt="${p.store_name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1170/1170679.png'">
                            <span class="store-name">${p.store_name}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:20px;">
                            <span class="store-price">$${Number(p.price).toFixed(2)}</span>
                            <a href="${p.affiliate_url}" target="_blank" class="btn-ver">Ir a la Oferta ↗</a>
                        </div>
                    </div>
                `).join('');
            } else {
                storeContainer.innerHTML = '<p style="color:#94a3b8;">No hay precios ni tiendas asociadas para este juego.</p>';
            }

            document.getElementById('main-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cerrarDetalle() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
</html>
