<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Juegos - Catálogo de Ofertas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 20px; }
        header { text-align: center; padding: 40px 0; border-bottom: 1px solid #1f293d; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; color: #ffffff; }
        header h1 span { color: #a855f7; }
        header p { color: #94a3b8; margin-top: 10px; font-size: 1.1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .game-card { background: #16192b; border-radius: 12px; overflow: hidden; border: 1px solid #1f293d; display: flex; flex-direction: column; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2); }
        .game-card img { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #1f293d; }
        .game-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .game-info h3 { font-size: 1.2rem; margin-bottom: 10px; color: #fff; }
        .platform { font-size: 0.85rem; color: #a855f7; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .summary { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 15px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .price-box { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid #1f293d; }
        .price { font-size: 1.2rem; font-weight: bold; color: #4ade80; }
        .btn-ver { background: #a855f7; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold; transition: 0.2s; text-align: center; }
        .btn-ver:hover { background: #9333ea; }
        .loading { text-align: center; grid-column: 1 / -1; padding: 40px; color: #94a3b8; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Radar<span>Juegos</span>.lat</h1>
            <p>El portal definitivo de ofertas y lanzamientos</p>
        </header>
        <main>
            <div id="games-grid" class="games-grid">
                <div class="loading">Cargando base de datos con 40 títulos...</div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://iqndiyuhcjxrugzfyjaj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbmRpeXVoY2p4cnVnemZ5amFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNjUyNzMsImV4cCI6MjEwOTY0MTI3M30.h-z1IcDbwAKvgVP1jwrjW8p-cxoTzuduIvLltjLDgqM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarCatalogo() {
            const grid = document.getElementById('games-grid');
            try {
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*, game_prices(*)')
                    .order('id', { ascending: true });

                if (error || !games.length) {
                    grid.innerHTML = '<p class="loading">No se encontraron juegos en la base de datos.</p>';
                    return;
                }

                grid.innerHTML = games.map(game => {
                    const precios = game.game_prices || [];
                    let mejorPrecio = 'Sin Stock';
                    let enlaceOferta = '#';
                    
                    if (precios.length > 0) {
                        // El sistema busca en el array EXCLUSIVO de este juego y saca el más barato
                        precios.sort((a, b) => Number(a.price) - Number(b.price));
                        mejorPrecio = `$${Number(precios[0].price).toFixed(2)}`;
                        enlaceOferta = precios[0].affiliate_url; // Redirige exactamente al enlace de este juego
                    }

                    return `
                        <div class="game-card">
                            <img src="${game.cover_image}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/300x160/1e1b4b/ffffff?text=Radar+Juegos'">
                            <div class="game-info">
                                <h3>${game.title}</h3>
                                <p class="platform">${game.platform}</p>
                                <p class="summary">${game.summary}</p>
                                <div class="price-box">
                                    <div>
                                        <span style="font-size: 0.75rem; color: #94a3b8; display: block;">Mejor precio</span>
                                        <span class="price">${mejorPrecio}</span>
                                    </div>
                                    <a href="${enlaceOferta}" target="_blank" class="btn-ver" ${enlaceOferta === '#' ? 'style="opacity:0.5; pointer-events:none;"' : ''}>Ver Oferta</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }
        document.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
</html>
